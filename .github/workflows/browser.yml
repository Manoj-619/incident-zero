name: Browser mission assurance
on:
  push:
    branches: [orbit-sentinel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm install --no-save --package-lock=false playwright@1.56.1
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node tests/browser-smoke.cjs
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-control-browser-previews
          path: frontend/browser-artifacts/
          if-no-files-found: ignore
