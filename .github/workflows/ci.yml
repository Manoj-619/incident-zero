name: Mission assurance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  numerical-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: ruff check backend && ruff format --check backend
      - run: pytest backend/tests -q
        env:
          OPENBLAS_NUM_THREADS: '1'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: python scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color && docker compose down
