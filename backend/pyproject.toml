[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-sentinel"
version = "0.1.0"
description = "Auditable orbital conjunction and maneuver simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "google-genai>=1.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["orbit_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
