services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_PATH: /state/incident-zero.sqlite3
    volumes:
      - incident-state:/state
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  incident-state:
